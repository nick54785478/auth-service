<form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
  <p-panel [showHeader]="false">
    <div class="card" #contentElement></div>
    <div class="grid p-fluid">
      <div class="col-12 md:col-3 lg:col-3">
        <label class="required">服務</label>
        <p-dropdown
          [options]="services"
          optionValue="value"
          placeholder="Please select"
          [showClear]="true"
          appendTo="body"
          formControlName="service"
        />
        <div *ngIf="formControlInvalid('service')">
          <small
            class="p-error"
            *ngIf="formControl('service').errors?.['required']"
          >
            資料不能為空
          </small>
        </div>
      </div>
      <div class="col-12 md:col-3 lg:col-3">
        <label class="required">種類</label>
        <p-dropdown
          [options]="types"
          optionValue="value"
          placeholder="Please select"
          [showClear]="true"
          appendTo="body"
          formControlName="type"
        />
        <div *ngIf="formControlInvalid('type')">
          <small
            class="p-error"
            *ngIf="formControl('type').errors?.['required']"
          >
            資料不能為空
          </small>
        </div>
      </div>
    </div>
    <div class="grid p-fluid">
      <div class="col-12 md:col-3 lg:col-3">
        <label class="required">名稱</label>
        <input type="text" pInputText formControlName="name" />
        <div *ngIf="formControlInvalid('name')">
          <small
            class="p-error"
            *ngIf="formControl('name').errors?.['required']"
          >
            資料不能為空
          </small>
        </div>
      </div>
      <div class="col-12 md:col-3 lg:col-3">
        <label class="required">代碼</label>
        <input type="text" pInputText formControlName="code" />
        <div *ngIf="formControlInvalid('code')">
          <small
            class="p-error"
            *ngIf="formControl('code').errors?.['required']"
          >
            資料不能為空
          </small>
        </div>
      </div>
    </div>
    <div class="grid p-fluid">
      <div class="col-12 md:col-6 lg:col-6">
        <label>敘述</label>
        <textarea
          pInputTextarea
          rows="3"
          [autoResize]="true"
          formControlName="description"
        ></textarea>
      </div>
    </div>
    <div class="grid p-fluid justify-content-end">
      <div class="col-12 md:col-3 lg:col-2">
        <button
          type="button"
          class="p-button-secondary p-button-outlined"
          pButton
          label="清除"
          *ngIf="!(formAction === 'edit')"
          [disabled]="formAction === 'edit'"
          (click)="clear()"
        ></button>
      </div>
      <div class="col-12 md:col-3 lg:col-2">
        <button
          type="button"
          pButton
          label="提交"
          (click)="onSubmit()"
        ></button>
      </div>
      <div class="col-12 md:col-3 lg:col-2">
        <button
          type="button"
          class="p-button-secondary p-button-outlined"
          pButton
          label="取消"
          (click)="onCloseForm()"
        ></button>
      </div>
    </div>
  </p-panel>
</form>
