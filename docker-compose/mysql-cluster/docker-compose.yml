version: '3.8'

services:
  mysql-master:
    image: mysql:8.0
    container_name: mysql-master
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app_db
    ports:
      - "3308:3306"
    volumes:
      - ./master/conf:/etc/mysql/conf.d
      - ./master/init:/docker-entrypoint-initdb.d
    networks:
      - mysql-net

  mysql-slave:
    image: mysql:8.0
    container_name: mysql-slave
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app_db
    ports:
      - "3309:3306"
    volumes:
      - ./slave/conf:/etc/mysql/conf.d
      - ./slave/init:/docker-entrypoint-initdb.d
    networks:
      - mysql-net
    depends_on:
      - mysql-master

networks:
  mysql-net:
    driver: bridge
